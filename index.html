    <script>
      // Suppress benign Vite websocket / HMR notices in AI Studio iframe environment
      (function() {
        var isViteNotice = function(arg) {
          if (!arg) return false;
          try {
            var str = '';
            if (typeof arg === 'string') {
              str = arg;
            } else if (arg instanceof Error) {
              str = (arg.message || '') + ' ' + (arg.stack || '');
            } else if (typeof arg === 'object') {
              str = JSON.stringify(arg);
            } else {
              str = String(arg);
            }
            var lower = str.toLowerCase();
            return lower.includes('[vite]') ||
                   lower.includes('vite-hmr') ||
                   lower.includes('websocket closed') ||
                   lower.includes('failed to connect to websocket') ||
                   lower.includes("reading 'send'") ||
                   (lower.includes('websocket') && (lower.includes(':3000') || lower.includes('connection failed') || lower.includes('connection lost')));
          } catch (e) {
            return false;
          }
        };

        var shouldSuppress = function(args) {
          for (var i = 0; i < args.length; i++) {
            if (isViteNotice(args[i])) return true;
          }
          return false;
        };

        var wrap = function(fn) {
          return function() {
            var args = Array.prototype.slice.call(arguments);
            if (shouldSuppress(args)) {
              return;
            }
            if (typeof fn === 'function') {
              fn.apply(console, args);
            }
          };
        };

        console.log = wrap(console.log);
        console.error = wrap(console.error);
        console.warn = wrap(console.warn);
        console.info = wrap(console.info);
        console.debug = wrap(console.debug);

        window.addEventListener('error', function(event) {
          if (event && (isViteNotice(event.message) || isViteNotice(event.error) || isViteNotice(event.filename))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && (isViteNotice(event.reason) || (event.reason && isViteNotice(event.reason.message)))) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
